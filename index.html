<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>혈압 기록</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1d2421; --sub:#5d6a65; --line:#e1ddd3;
  --brand:#1f6f5c; --brand-ink:#fff; --warn:#b4540a; --bad:#b3261e; --ok:#1f6f5c; --mid:#8a6d00;
  --chip:#eef3f1;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#141817;--card:#1e2422;--ink:#eef2f0;--sub:#a3b0ab;--line:#2f3835;--brand:#4fb89c;--brand-ink:#0b1713;--warn:#f0a35e;--bad:#ff8a80;--ok:#4fb89c;--mid:#e3c25a;--chip:#26302d;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#141817;--card:#1e2422;--ink:#eef2f0;--sub:#a3b0ab;--line:#2f3835;--brand:#4fb89c;--brand-ink:#0b1713;--warn:#f0a35e;--bad:#ff8a80;--ok:#4fb89c;--mid:#e3c25a;--chip:#26302d;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.45;}
main{max-width:560px;margin:0 auto;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.35rem;margin:8px 0 12px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabs button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-weight:700;padding:16px 0;min-height:60px}
.tabs button[aria-selected=true]{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{font:inherit;font-weight:700;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:56px}
.seg button[aria-pressed=true]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
label.date{display:block;font-size:.85rem;color:var(--sub);margin-bottom:10px}
.dt{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:10px}
.dt>div{min-width:0}
.dt label{margin-bottom:6px}
input[type=date],input[type=time]{font:inherit;font-size:1rem;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%;min-height:52px}
.row{padding:12px 0;border-top:1px dashed var(--line)}
.row:first-of-type{border-top:0}
.row h3{margin:0 0 8px;font-size:1rem}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair label{font-size:.8rem;color:var(--sub);display:block}
.pair input{width:100%;font:inherit;font-size:1.7rem;font-weight:700;text-align:center;padding:10px 4px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:64px}
.pair input:focus{outline:3px solid var(--brand);border-color:var(--brand)}
.hint{font-size:.8rem;color:var(--sub);margin:6px 0 0}
.timer{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--chip);border-radius:12px;padding:12px 14px;margin:6px 0}
.timer b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.timer.done{background:var(--brand);color:var(--brand-ink)}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:16px;min-height:60px;width:100%;background:var(--brand);color:var(--brand-ink);font-size:1.1rem}
.btn.ghost{background:var(--chip);color:var(--ink);font-size:.9rem;min-height:48px;padding:10px 14px;width:auto}
.btn.danger{background:none;color:var(--bad);font-size:.8rem;min-height:44px;padding:8px 10px;width:auto;border:1px solid var(--line)}
.result{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--chip);font-weight:700}
.s-ok{color:var(--ok)} .s-mid{color:var(--mid)} .s-warn{color:var(--warn)} .s-bad{color:var(--bad)}
.day{margin-bottom:14px}
.day h2{font-size:.95rem;color:var(--sub);margin:0 0 6px}
.entry{display:flex;justify-content:space-between;align-items:center;gap:8px}
.entry .rd{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.entry .rd small{display:inline;font-weight:600;margin-left:6px}
.entry small{display:block;color:var(--sub);font-size:.78rem}
.entry .actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.slotname{font-weight:700}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.empty{color:var(--sub);text-align:center;padding:32px 8px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:9;max-width:90%}
svg text{font-family:inherit}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--sub);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.note{font-size:.75rem;color:var(--sub);margin-top:18px}
.people{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.people button{font:inherit;font-weight:700;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:48px}
.people button[aria-pressed=true]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.people .ghostchip{border-style:dashed;color:var(--sub);font-weight:600}
.pedit{display:grid;gap:10px}
.pedit input{font:inherit;font-size:1.2rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:52px;width:100%}
.pedit .rowbtn{display:flex;gap:8px;flex-wrap:wrap}
.pedit .rowbtn .btn{flex:1;min-width:96px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="people" id="people" role="group" aria-label="누구의 기록인지 선택"></div>
  <div class="card pedit" id="pedit" hidden>
    <label class="date" for="pname" id="pname-label" style="margin:0">이름</label>
    <input id="pname" maxlength="10" placeholder="예: 엄마" autocomplete="off">
    <div class="rowbtn">
      <button class="btn" id="psave">저장</button>
      <button class="btn ghost" id="pcancel">취소</button>
      <button class="btn danger" id="pdel" hidden>삭제</button>
    </div>
  </div>
  <section id="view-record">
    <h1>혈압 기록</h1>
    <div class="card">
      <div class="dt">
        <div><label class="date" for="date">날짜</label><input type="date" id="date"></div>
        <div><label class="date" for="time">시간</label><input type="time" id="time"></div>
      </div>
      <div class="seg" style="margin-top:12px" role="group" aria-label="측정 시간">
        <button id="slot-am" aria-pressed="true">☀️ 아침</button>
        <button id="slot-pm" aria-pressed="false">🌙 저녁</button>
      </div>
      <p class="hint">앉아서 5분 쉰 뒤, 2분 간격으로 3번 재세요.</p>
    </div>

    <div class="card" id="readings"></div>

    <button class="btn" id="save" style="margin-top:12px">저장하기</button>
  </section>

  <section id="view-history" hidden>
    <h1>지난 기록</h1>
    <div class="toolbar">
      <button class="btn ghost" id="share">💬 카톡 등으로 보내기</button>
      <button class="btn ghost" id="copy">📋 요약 복사</button>
      <button class="btn ghost" id="csv">⬇️ 엑셀 저장</button>
    </div>
    <textarea id="fallback" rows="8" hidden style="width:100%;font:inherit;font-size:.8rem;margin-bottom:12px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px"></textarea>
    <div class="card" id="chart-card" hidden>
      <b>최근 혈압 (잰 값 전부)</b>
      <div id="chart"></div>
      <div class="legend"><span><i style="background:var(--brand)"></i>높은 혈압</span><span><i style="background:var(--warn)"></i>낮은 혈압</span></div>
    </div>
    <div id="list"></div>
  </section>

  <p class="note">※ 색 표시는 가정혈압 기준(135/85 이상 높음, 180/120 이상 매우 높음)이며 진단이 아닙니다. 혈압이 180/120 이상이거나 가슴 통증·심한 두통·마비 증상이 있으면 즉시 119 또는 병원에 연락하세요. 기록은 이 기기의 브라우저에만 저장됩니다.</p>
</main>

<nav class="tabs" role="tablist">
  <button role="tab" id="tab-record" aria-selected="true">✏️ 기록하기</button>
  <button role="tab" id="tab-history" aria-selected="false">📅 지난 기록</button>
</nav>

<script>
(() => {
  const KEY = "bp-records-v1";
  const WAIT = 120; // 측정 간격(초)
  const $ = (id) => document.getElementById(id);

  const store = {
    load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } },
    save(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch { toast("저장 공간 오류: 사생활 보호 모드인지 확인해 주세요"); } },
  };
  const PKEY = "bp-people-v1", CKEY = "bp-current-v1", MAXP = 5;
  const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  let people = lsGet(PKEY);
  if (!Array.isArray(people) || !people.length) people = [{ id: "p1", name: "나" }];
  let cur = lsGet(CKEY);
  if (!people.some((q) => q.id === cur)) cur = people[0].id;
  let records = store.load();
  if (records.some((x) => !x.who)) { records.forEach((x) => { x.who ||= people[0].id; }); store.save(records); } // 사람 기능 이전 기록은 첫 번째 사람 것으로
  const mine = () => records.filter((x) => x.who === cur);
  const curName = () => people.find((q) => q.id === cur)?.name || "";
  lsSet(PKEY, people); lsSet(CKEY, cur);
  let slot = new Date().getHours() < 14 ? "am" : "pm";
  const ymd = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  $("date").value = ymd();
  $("date").max = ymd();
  const hm = (d = new Date()) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  const fmtTime = (t) => { if (!t) return ""; const [h, m] = t.split(":").map(Number); return `${h < 12 ? "오전" : "오후"} ${h % 12 || 12}:${String(m).padStart(2, "0")}`; };
  $("time").value = hm();

  // 대한고혈압학회 2022 진료지침 가정혈압 기준(135/85 이상 고혈압)을 쉬운 말로 표시
  function grade(s, d) {
    if (s >= 180 || d >= 120) return ["s-bad", "매우 높음"];
    if (s >= 135 || d >= 85) return ["s-warn", "높음"];
    if (s >= 120 || d >= 80) return ["s-mid", "조금 높음"];
    return ["s-ok", "정상"];
  }
  const slotName = (s) => (s === "am" ? "☀️ 아침" : "🌙 저녁");

  // ---- 입력 폼 ----
  const wrap = $("readings");
  let timerEnd = 0, timerFor = -1, tick = null;
  wrap.innerHTML = [0, 1, 2].map((i) => `
    <div class="row" data-i="${i}">
      <h3>${i + 1}번째 측정</h3>
      <div class="pair">
        <div><label for="s${i}">높은 혈압 (수축기)</label><input id="s${i}" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="120" autocomplete="off"></div>
        <div><label for="d${i}">낮은 혈압 (이완기)</label><input id="d${i}" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="80" autocomplete="off"></div>
      </div>
      ${i < 2 ? `<div class="timer" id="t${i}"><span id="tl${i}">${i + 2}번째는 2분 뒤에 재세요</span><b id="tv${i}">2:00</b></div>` : ""}
    </div>`).join("");

  const inp = (k, i) => $(k + i);
  function readForm() {
    return [0, 1, 2].map((i) => [parseInt(inp("s", i).value, 10), parseInt(inp("d", i).value, 10)]);
  }
  function fillForm(rec) {
    [0, 1, 2].forEach((i) => {
      inp("s", i).value = rec?.r[i]?.[0] ?? "";
      inp("d", i).value = rec?.r[i]?.[1] ?? "";
    });
    stopTimer();
  }
  function loadCurrent() {
    const rec = mine().find((x) => x.date === $("date").value && x.slot === slot);
    fillForm(rec);
    $("time").value = rec?.time || hm();
  }
  const valid = ([s, d]) => s >= 60 && s <= 260 && d >= 30 && d <= 160 && s > d;

  // ---- 2분 타이머 ----
  function stopTimer() {
    clearInterval(tick); tick = null; timerFor = -1;
    [0, 1].forEach((i) => { $("t" + i).classList.remove("done"); $("tl" + i).textContent = `${i + 2}번째는 2분 뒤에 재세요`; $("tv" + i).textContent = "2:00"; });
  }
  function startTimer(i) {
    stopTimer();
    timerFor = i; timerEnd = Date.now() + WAIT * 1000;
    const box = $("t" + i);
    $("tl" + i).textContent = `${i + 2}번째 측정까지`;
    const draw = () => {
      const left = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
      $("tv" + i).textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
      if (left === 0) {
        clearInterval(tick); tick = null;
        box.classList.add("done");
        $("tl" + i).textContent = `지금 ${i + 2}번째를 재세요`;
        $("tv" + i).textContent = "⏰";
        beep();
        inp("s", i + 1).focus();
      }
    };
    draw(); tick = setInterval(draw, 500);
  }
  function beep() {
    try { navigator.vibrate?.([300, 150, 300, 150, 300]); } catch {}
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.4, 0.8].forEach((t) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.25, ac.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + 0.3);
        o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.3);
      });
    } catch {}
  }

  // 입력 편의: 높은 혈압 3자리 입력 → 낮은 혈압으로 이동, 낮은 혈압 입력 완료 → 타이머 시작
  [0, 1, 2].forEach((i) => {
    inp("s", i).addEventListener("input", (e) => {
      e.target.value = e.target.value.replace(/\D/g, "").slice(0, 3);
      if (e.target.value.length === 3) inp("d", i).focus();
      });
    inp("d", i).addEventListener("input", (e) => {
      e.target.value = e.target.value.replace(/\D/g, "").slice(0, 3);
      });
    inp("d", i).addEventListener("change", () => {
      if (i < 2 && valid([+inp("s", i).value, +inp("d", i).value]) && !inp("s", i + 1).value) startTimer(i);
    });
  });

  // ---- 저장 ----
  $("save").onclick = () => {
    const r = readForm();
    const bad = r.findIndex((x, i) => (Number.isNaN(x[0]) && Number.isNaN(x[1])) ? false : !valid(x));
    if (bad >= 0) return toast(`${bad + 1}번째 숫자를 다시 확인해 주세요 (높은 혈압이 낮은 혈압보다 커야 해요)`);
    if (!r.some(valid)) return toast("혈압 숫자를 입력해 주세요");
    const rec = { date: $("date").value, time: $("time").value, slot, who: cur, r: r.map((x) => (valid(x) ? x : null)).filter(Boolean) };
    records = records.filter((x) => !(x.who === cur && x.date === rec.date && x.slot === rec.slot));
    records.push(rec);
    records.sort((a, b) => (a.date + (a.slot === "am" ? 0 : 1) < b.date + (b.slot === "am" ? 0 : 1) ? 1 : -1));
    store.save(records);
    toast(rec.r.length < 3 ? `${curName()} 기록 저장 (${rec.r.length}회만 입력됨)` : `${curName()} 기록을 저장했어요 ✅`);
    stopTimer();
  };

  $("date").onchange = loadCurrent;
  const setSlot = (s) => { slot = s; $("slot-am").setAttribute("aria-pressed", s === "am"); $("slot-pm").setAttribute("aria-pressed", s === "pm"); loadCurrent(); };
  $("slot-am").onclick = () => setSlot("am");
  $("slot-pm").onclick = () => setSlot("pm");

  // ---- 내역 ----
  function renderHistory() {
    const list = $("list");
    if (!mine().length) { list.innerHTML = '<div class="empty">아직 기록이 없어요.<br>‘기록하기’에서 첫 기록을 남겨보세요.</div>'; $("chart-card").hidden = true; return; }
    const days = {};
    mine().forEach((x) => (days[x.date] ||= []).push(x));
    const wd = "일월화수목금토";
    list.innerHTML = Object.keys(days).sort().reverse().map((date) => {
      const [y, m, d] = date.split("-").map(Number);
      const label = `${m}월 ${d}일 (${wd[new Date(y, m - 1, d).getDay()]})`;
      const items = days[date].sort((a, b) => (a.slot === "am" ? -1 : 1)).map((x) => {
        const rows = x.r.map((v, k) => { const [cls, msg] = grade(v[0], v[1]); return `<div class="rd ${cls}">${k + 1}회 ${v[0]} / ${v[1]}<small>${msg}</small></div>`; }).join("");
        return `<div class="card entry">
          <div><span class="slotname">${slotName(x.slot)}</span> <small style="display:inline">${fmtTime(x.time)}</small>
            ${rows}</div>
          <div class="actions"><button class="btn ghost" data-edit="${date}|${x.slot}">수정</button><button class="btn danger" data-del="${date}|${x.slot}">삭제</button></div>
        </div>`;
      }).join("");
      return `<div class="day"><h2>${label}</h2>${items}</div>`;
    }).join("");
    drawChart();
  }
  $("list").addEventListener("click", (e) => {
    const ed = e.target.dataset.edit, del = e.target.dataset.del;
    if (ed) { const [d, s] = ed.split("|"); $("date").value = d; show("record"); setSlot(s); }
    if (del) {
      if (e.target.dataset.armed !== "1") {
        e.target.dataset.armed = "1"; e.target.textContent = "정말 삭제";
        setTimeout(() => { if (e.target.isConnected) { e.target.dataset.armed = ""; e.target.textContent = "삭제"; } }, 3000);
        return;
      }
      const [d, s] = del.split("|");
      records = records.filter((x) => !(x.who === cur && x.date === d && x.slot === s));
      store.save(records); renderHistory();
    }
  });

  function drawChart() {
    const pts = [...mine()].sort((a, b) => (a.date + a.slot > b.date + b.slot ? 1 : -1)).slice(-14)
      .map((x) => ({ r: x.r, t: `${+x.date.slice(5, 7)}/${+x.date.slice(8)} ${x.slot === "am" ? "아침" : "저녁"}` }));
    $("chart-card").hidden = pts.length < 2;
    if (pts.length < 2) return;
    const W = 480, H = 220, L = 34, R = 20, T = 10, B = 28;
    const lo = 50, hi = Math.max(160, Math.max(...pts.flatMap((p) => p.r.map((v) => v[0]))) + 10);
    const x = (i) => L + (i * (W - L - R)) / (pts.length - 1);
    const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
    const dots = (k, c) => pts.map((p, i) => p.r.map((v, n) => `<circle cx="${x(i) + (n - (p.r.length - 1) / 2) * 7}" cy="${y(v[k])}" r="3.5" fill="${c}"/>`).join("")).join("");
    const grid = [135, 85].map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity=".25" stroke-dasharray="4 4"/><text x="2" y="${y(v) + 4}" font-size="11" fill="currentColor" opacity=".7">${v}</text>`).join("");
    const step = Math.ceil(pts.length / 7);
    const xl = pts.map((p, i) => (i % step === 0 ? `<text x="${x(i)}" y="${H - 8}" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">${p.t}</text>` : "")).join("");
    $("chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="최근 혈압 추이 그래프" style="color:var(--sub)">${grid}${dots(0, "var(--brand)")}${dots(1, "var(--warn)")}${xl}</svg>`;
  }

  // ---- 내보내기 ----
  const sorted = () => [...mine()].sort((a, b) => (a.date + a.slot > b.date + b.slot ? 1 : -1));
  function summaryText() {
    const lines = sorted().slice(-28).map((x) => {
      return `${x.date} ${fmtTime(x.time)} ${x.slot === "am" ? "아침" : "저녁"}  ${x.r.map((v) => v.join("/")).join(", ")}`;
    });
    return `[가정혈압 기록] ${curName()} · 최근 ${lines.length}회 (높은/낮은 혈압)\n${lines.join("\n")}`;
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast("복사했어요. 카톡에 붙여넣으세요"); }
    catch { const ta = $("fallback"); ta.hidden = false; ta.value = text; ta.focus(); ta.select(); toast("글을 길게 눌러 복사하세요"); }
  }
  $("copy").onclick = () => { if (!mine().length) return toast("기록이 없어요"); copyText(summaryText()); };
  $("share").onclick = async () => {
    if (!mine().length) return toast("기록이 없어요");
    const text = summaryText();
    if (navigator.share) {
      try { await navigator.share({ title: "혈압 기록", text }); } catch (e) { if (e?.name !== "AbortError") copyText(text); }
    } else copyText(text);
  };
  $("csv").onclick = () => {
    if (!mine().length) return toast("기록이 없어요");
    const rows = [["이름", "날짜", "시간", "아침/저녁", "1회 높은", "1회 낮은", "2회 높은", "2회 낮은", "3회 높은", "3회 낮은"]];
    sorted().forEach((x) => {
      const cells = [0, 1, 2].flatMap((i) => x.r[i] || ["", ""]);
      rows.push([curName(), x.date, x.time || "", x.slot === "am" ? "아침" : "저녁", ...cells]);
    });
    const blob = new Blob(["\ufeff" + rows.map((r) => r.join(",")).join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `blood-pressure_${ymd()}.csv`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast("엑셀 파일(CSV)로 저장했어요");
  };
  // ---- 사람 선택·추가 ----
  let editing = null; // null | "add" | "rename"
  const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function renderPeople() {
    $("people").innerHTML = people.map((q) => `<button data-pid="${q.id}" aria-pressed="${q.id === cur}">${esc(q.name)}</button>`).join("") +
      (people.length < MAXP ? '<button class="ghostchip" data-act="add">＋ 사람 추가</button>' : "") +
      '<button class="ghostchip" data-act="rename">✎ 이름 바꾸기</button>';
  }
  function openEdit(mode) {
    editing = mode;
    $("pedit").hidden = false;
    $("pname-label").textContent = mode === "add" ? `새로 추가할 사람 이름 (${people.length}/${MAXP}명)` : "이름 바꾸기";
    $("pname").value = mode === "rename" ? curName() : "";
    $("pdel").hidden = !(mode === "rename" && people.length > 1);
    $("pdel").textContent = "이 사람 삭제"; $("pdel").dataset.armed = "";
    $("pname").focus();
  }
  const closeEdit = () => { editing = null; $("pedit").hidden = true; };
  function switchTo(id) {
    cur = id; lsSet(CKEY, cur); closeEdit(); renderPeople(); loadCurrent();
    if (!$("view-history").hidden) renderHistory();
    $("fallback").hidden = true;
  }
  $("people").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.pid) return switchTo(b.dataset.pid);
    if (b.dataset.act === "add") return openEdit("add");
    if (b.dataset.act === "rename") return openEdit("rename");
  });
  $("psave").onclick = () => {
    const name = $("pname").value.trim();
    if (!name) return toast("이름을 입력해 주세요");
    if (people.some((q) => q.name === name && !(editing === "rename" && q.id === cur))) return toast("같은 이름이 이미 있어요");
    if (editing === "add") {
      if (people.length >= MAXP) return toast(`최대 ${MAXP}명까지 추가할 수 있어요`);
      const id = "p" + Date.now().toString(36);
      people.push({ id, name }); lsSet(PKEY, people); toast(`${name} 추가했어요`); switchTo(id);
    } else {
      people.find((q) => q.id === cur).name = name; lsSet(PKEY, people); closeEdit(); renderPeople(); toast("이름을 바꿨어요");
    }
  };
  $("pname").addEventListener("keydown", (e) => { if (e.key === "Enter") $("psave").click(); });
  $("pcancel").onclick = closeEdit;
  $("pdel").onclick = () => {
    if ($("pdel").dataset.armed !== "1") {
      $("pdel").dataset.armed = "1"; $("pdel").textContent = `${curName()} 기록 모두 삭제? 한 번 더 누르세요`;
      return;
    }
    const gone = cur; const nm = curName();
    records = records.filter((x) => x.who !== gone); store.save(records);
    people = people.filter((q) => q.id !== gone); lsSet(PKEY, people);
    toast(`${nm}와 기록을 삭제했어요`); switchTo(people[0].id);
  };

  // ---- 탭/토스트 ----
  function show(v) {
    $("view-record").hidden = v !== "record"; $("view-history").hidden = v !== "history";
    $("tab-record").setAttribute("aria-selected", v === "record"); $("tab-history").setAttribute("aria-selected", v === "history");
    if (v === "history") renderHistory();
    window.scrollTo(0, 0);
  }
  $("tab-record").onclick = () => show("record");
  $("tab-history").onclick = () => show("history");
  let tt;
  function toast(msg) {
    document.querySelector(".toast")?.remove();
    const el = Object.assign(document.createElement("div"), { className: "toast", textContent: msg, role: "status" });
    document.body.append(el); clearTimeout(tt); tt = setTimeout(() => el.remove(), 3500);
  }

  renderPeople();
  setSlot(slot);
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
